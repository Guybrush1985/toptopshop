# Übernimmt den aktuellen Stand von Guybrush1985/tandem-now (main) nach
# src/static/tandem-now/ und stößt danach das Deployment von toptop.shop an.
# Der Ordner src/static/tandem-now/ wird dabei komplett ersetzt – dort nichts
# von Hand ändern, sondern im Repo tandem-now.
#
# Voraussetzung: Secret TANDEM_NOW_TOKEN in diesem Repo, ein Fine-grained
# Personal Access Token mit Lesezugriff (Contents: Read-only) nur auf
# Guybrush1985/tandem-now. Fehlt es, endet der Lauf mit einer Warnung.

name: "tandem-now übernehmen"

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [tandem-now-updated]

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-tandem-now
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Token prüfen
        id: token
        env:
          TOKEN: ${{ secrets.TANDEM_NOW_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::Secret TANDEM_NOW_TOKEN fehlt – tandem-now wurde nicht übernommen."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: toptopshop auschecken
        if: steps.token.outputs.ok == 'true'
        uses: actions/checkout@v4
        with:
          ref: main

      - name: tandem-now auschecken
        if: steps.token.outputs.ok == 'true'
        uses: actions/checkout@v4
        with:
          repository: Guybrush1985/tandem-now
          ref: main
          token: ${{ secrets.TANDEM_NOW_TOKEN }}
          path: _tandem-now

      - name: Dateien übernehmen
        if: steps.token.outputs.ok == 'true'
        id: copy
        run: |
          SRC_SHA=$(git -C _tandem-now rev-parse --short HEAD)
          T=src/static/tandem-now
          rm -rf "$T" && mkdir -p "$T"
          cp -a _tandem-now/. "$T"/
          rm -rf _tandem-now "$T/.git" "$T/.github" "$T/.claude" "$T/README.md" "$T/CLAUDE.md" "$T/.gitignore"
          echo "sha=$SRC_SHA" >> "$GITHUB_OUTPUT"
          if [ -z "$(git status --porcelain -- "$T")" ]; then
            echo "Keine Änderungen (tandem-now $SRC_SHA)."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git status --short -- "$T"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Node einrichten
        if: steps.copy.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build prüfen
        if: steps.copy.outputs.changed == 'true'
        run: node build.mjs > /dev/null

      - name: Committen und Deployment anstoßen
        if: steps.copy.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- src/static/tandem-now
          git commit -m "tandem-now: Stand ${{ steps.copy.outputs.sha }} übernommen"
          git pull --rebase origin main
          git push origin HEAD:main
          # Pushes mit dem GITHUB_TOKEN starten keine weiteren Workflows,
          # daher das Deploy-Now-Deployment ausdrücklich auslösen.
          gh workflow run toptopshop-orchestration.yaml --ref main
